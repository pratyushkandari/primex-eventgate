[project]
name = "eventgate"
dynamic = ["version"]
description = "Consumer-aware release gate for event contracts"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.10",
    "boto3>=1.34",
    "mangum>=0.17",
    "click>=8.0",
    "cedarpy>=4.0",
]

[project.scripts]
eventgate = "eventgate.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "ruff>=0.8",
    "mypy>=1.15",
    "boto3-stubs[dynamodb,events]>=1.34",
    "moto[dynamodb,events]>=5.1",
    "locust>=2.37",
]

[tool.setuptools.dynamic]
version = { attr = "eventgate.__version__" }

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.setuptools.package-data]
eventgate = ["policies/*.cedar"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/src", "."]

[tool.coverage.run]
source = ["eventgate"]

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.mypy]
python_version = "3.12"
files = ["backend/src/eventgate"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["cedarpy", "mangum", "moto", "moto.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.ruff]
src = ["backend/src", "backend/tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["eventgate", "scripts"]

[tool.ruff.format]
quote-style = "double"
