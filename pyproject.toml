[project]
name = "eventgate"
version = "0.1.0"
description = "Consumer-aware safety gate for event-driven systems"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.10",
    "boto3>=1.34",
    "mangum>=0.17",
    "click>=8.0",
    "cedarpy>=4.0",
]

[project.scripts]
eventgate = "eventgate.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/src", "."]

[tool.coverage.run]
source = ["eventgate"]

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.ruff]
src = ["backend/src", "backend/tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.format]
quote-style = "double"
