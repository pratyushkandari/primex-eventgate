# AWS SAM configuration file for EventGate Phase 2
# Safe to commit: contains NO secrets, NO credentials, and NO sensitive tokens.
version = 0.1

[default]
[default.global.parameters]
stack_name = "primex-eventgate-dev"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
resolve_s3 = true
stack_name = "primex-eventgate-dev"
parameter_overrides = "ProjectName=\"primex-eventgate\" Environment=\"dev\""
