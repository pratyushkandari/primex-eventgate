# `sam build` / `sam deploy` defaults for the dev stack. Contains no credentials.
version = 0.1

[default]
[default.global.parameters]
stack_name = "primex-eventgate-dev"
region = "ap-south-1"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
resolve_s3 = true
stack_name = "primex-eventgate-dev"
region = "ap-south-1"
parameter_overrides = "ProjectName=\"primex-eventgate\" Environment=\"dev\""
