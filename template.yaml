AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  PrimeX EventGate - Phase 2
  Serverless AWS Runtime + DynamoDB Persistence for Consumer-Aware Event Safety Gate

Parameters:
  ProjectName:
    Type: String
    Default: primex-eventgate
    Description: Project identifier for resource naming and tagging
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment stage environment

Globals:
  Function:
    Timeout: 10
    MemorySize: 256
    Runtime: python3.14
    Architectures:
      - x86_64
    Tags:
      Project: EventGate
      Team: PrimeX
      Phase: Phase2
      Environment: !Ref Environment

Resources:
  # ---------------------------------------------------------------------------
  # DynamoDB: Event Contracts Table
  # Partition key: eventType (String), Sort key: version (Number)
  # Access patterns: GetItem(eventType, version), Query(eventType)
  # ---------------------------------------------------------------------------
  EventContractsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-${Environment}-event-contracts"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: eventType
          AttributeType: S
        - AttributeName: version
          AttributeType: N
      KeySchema:
        - AttributeName: eventType
          KeyType: HASH
        - AttributeName: version
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: EventGate
        - Key: Team
          Value: PrimeX
        - Key: Phase
          Value: Phase2
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------------------------
  # DynamoDB: Consumer Contracts Table
  # Partition key: consumerId (String)
  # GSI: EventTypeIndex (eventType HASH, consumerId RANGE)
  # Access patterns: GetItem(consumerId), Query(EventTypeIndex, eventType)
  # ---------------------------------------------------------------------------
  ConsumerContractsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-${Environment}-consumer-contracts"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: consumerId
          AttributeType: S
        - AttributeName: eventType
          AttributeType: S
      KeySchema:
        - AttributeName: consumerId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: EventTypeIndex
          KeySchema:
            - AttributeName: eventType
              KeyType: HASH
            - AttributeName: consumerId
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: EventGate
        - Key: Team
          Value: PrimeX
        - Key: Phase
          Value: Phase2
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------------------------
  # DynamoDB: Release History Table
  # Partition key: recordId (String)
  # GSI: EventTypeIndex (eventType HASH, timestamp RANGE)
  # Access patterns: PutItem(recordId), GetItem(recordId), Query(EventTypeIndex, eventType)
  # ---------------------------------------------------------------------------
  ReleaseHistoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-${Environment}-release-history"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: recordId
          AttributeType: S
        - AttributeName: eventType
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: recordId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: EventTypeIndex
          KeySchema:
            - AttributeName: eventType
              KeyType: HASH
            - AttributeName: timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      Tags:
        - Key: Project
          Value: EventGate
        - Key: Team
          Value: PrimeX
        - Key: Phase
          Value: Phase5
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------------------------
  # API Gateway HTTP API
  # ---------------------------------------------------------------------------
  EventGateHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - X-Request-ID
          - Authorization
        ExposeHeaders:
          - X-Request-ID
        MaxAge: 300
      Tags:
        Project: EventGate
        Team: PrimeX
        Phase: Phase2
        Environment: !Ref Environment

  # ---------------------------------------------------------------------------
  # Lambda Function: EventGate Runtime
  # ---------------------------------------------------------------------------
  EventGateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-api"
      Description: EventGate consumer-aware compatibility analysis engine
      CodeUri: backend/src
      Handler: eventgate.lambda_handler.handler
      Environment:
        Variables:
          EVENTGATE_STORAGE_BACKEND: dynamodb
          EVENT_CONTRACTS_TABLE_NAME: !Ref EventContractsTable
          CONSUMER_CONTRACTS_TABLE_NAME: !Ref ConsumerContractsTable
          RELEASE_HISTORY_TABLE_NAME: !Ref ReleaseHistoryTable
          EVENTGATE_EVENT_PUBLISHER: eventbridge
          EVENTBRIDGE_BUS_NAME: !Ref EventGateEventBus
      Policies:
        # Least privilege: Read-only access to EventContractsTable (GetItem, Query)
        - Statement:
            - Sid: ReadEventContractsTable
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
              Resource: !GetAtt EventContractsTable.Arn
        # Least privilege: Read-only access to ConsumerContractsTable and GSI
        - Statement:
            - Sid: ReadConsumerContractsTable
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
              Resource:
                - !GetAtt ConsumerContractsTable.Arn
                - !Sub "${ConsumerContractsTable.Arn}/index/*"
        # Least privilege: Read and write access to ReleaseHistoryTable and GSI
        - Statement:
            - Sid: AccessReleaseHistoryTable
              Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Query
              Resource:
                - !GetAtt ReleaseHistoryTable.Arn
                - !Sub "${ReleaseHistoryTable.Arn}/index/*"
        # Least privilege: PutEvents on EventGate custom event bus only
        - Statement:
            - Sid: PublishToEventGateBus
              Effect: Allow
              Action:
                - events:PutEvents
              Resource: !GetAtt EventGateEventBus.Arn
      Events:
        HealthCheck:
          Type: HttpApi
          Properties:
            ApiId: !Ref EventGateHttpApi
            Path: /health
            Method: GET
        Analyze:
          Type: HttpApi
          Properties:
            ApiId: !Ref EventGateHttpApi
            Path: /api/v1/analyze
            Method: POST
        PublishEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref EventGateHttpApi
            Path: /api/v1/events/publish
            Method: POST

  # ---------------------------------------------------------------------------
  # EventBridge: Custom Event Bus
  # ---------------------------------------------------------------------------
  EventGateEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub "${ProjectName}-${Environment}-bus"
      Tags:
        - Key: Project
          Value: EventGate
        - Key: Team
          Value: PrimeX
        - Key: Phase
          Value: Phase3
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------------------------
  # Consumer Lambda Functions (Lightweight Demonstration Handlers)
  # ---------------------------------------------------------------------------
  BillingConsumerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-consumer-billing"
      Description: "Consumer service demonstration: Billing"
      CodeUri: consumers/src
      Handler: consumer_handler.handler
      Runtime: python3.14
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 5
      Environment:
        Variables:
          CONSUMER_ID: billing-service
      Tags:
        Project: EventGate
        Team: PrimeX
        Phase: Phase3
        Environment: !Ref Environment

  InventoryConsumerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-consumer-inventory"
      Description: "Consumer service demonstration: Inventory"
      CodeUri: consumers/src
      Handler: consumer_handler.handler
      Runtime: python3.14
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 5
      Environment:
        Variables:
          CONSUMER_ID: inventory-service
      Tags:
        Project: EventGate
        Team: PrimeX
        Phase: Phase3
        Environment: !Ref Environment

  AnalyticsConsumerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${Environment}-consumer-analytics"
      Description: "Consumer service demonstration: Analytics"
      CodeUri: consumers/src
      Handler: consumer_handler.handler
      Runtime: python3.14
      Architectures:
        - x86_64
      MemorySize: 128
      Timeout: 5
      Environment:
        Variables:
          CONSUMER_ID: analytics-service
      Tags:
        Project: EventGate
        Team: PrimeX
        Phase: Phase3
        Environment: !Ref Environment

  # ---------------------------------------------------------------------------
  # EventBridge: Rule & Fan-Out Targets
  # ---------------------------------------------------------------------------
  OrderPlacedEventRule:
    Type: AWS::Events::Rule
    Properties:
      EventBusName: !Ref EventGateEventBus
      Name: !Sub "${ProjectName}-${Environment}-order-placed-rule"
      Description: "Routes approved OrderPlaced events to registered consumer demonstration Lambdas"
      State: ENABLED
      EventPattern:
        source:
          - primex.eventgate
        detail-type:
          - EventGateEvent
        detail:
          eventType:
            - OrderPlaced
      Targets:
        - Id: BillingConsumerTarget
          Arn: !GetAtt BillingConsumerFunction.Arn
        - Id: InventoryConsumerTarget
          Arn: !GetAtt InventoryConsumerFunction.Arn
        - Id: AnalyticsConsumerTarget
          Arn: !GetAtt AnalyticsConsumerFunction.Arn

  # ---------------------------------------------------------------------------
  # Lambda Resource-Based Permissions (EventBridge -> Consumers)
  # ---------------------------------------------------------------------------
  BillingConsumerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt BillingConsumerFunction.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt OrderPlacedEventRule.Arn

  InventoryConsumerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt InventoryConsumerFunction.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt OrderPlacedEventRule.Arn

  AnalyticsConsumerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt AnalyticsConsumerFunction.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt OrderPlacedEventRule.Arn

Outputs:
  ApiUrl:
    Description: HTTP API Gateway endpoint base URL
    Value: !Sub "https://${EventGateHttpApi}.execute-api.${AWS::Region}.amazonaws.com"

  EventContractsTableName:
    Description: DynamoDB Event Contracts Table Name
    Value: !Ref EventContractsTable

  ConsumerContractsTableName:
    Description: DynamoDB Consumer Contracts Table Name
    Value: !Ref ConsumerContractsTable

  ReleaseHistoryTableName:
    Description: DynamoDB Release History Table Name
    Value: !Ref ReleaseHistoryTable

  LambdaFunctionName:
    Description: EventGate Lambda Function Name
    Value: !Ref EventGateFunction

  EventBusName:
    Description: EventGate Custom EventBus Name
    Value: !Ref EventGateEventBus

  EventBusArn:
    Description: EventGate Custom EventBus ARN
    Value: !GetAtt EventGateEventBus.Arn

  BillingConsumerFunctionName:
    Description: Billing Consumer Lambda Function Name
    Value: !Ref BillingConsumerFunction

  InventoryConsumerFunctionName:
    Description: Inventory Consumer Lambda Function Name
    Value: !Ref InventoryConsumerFunction

  AnalyticsConsumerFunctionName:
    Description: Analytics Consumer Lambda Function Name
    Value: !Ref AnalyticsConsumerFunction
