AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Lets GitHub Actions on the main branch of the EventGate repository deploy the
  primex-eventgate-dev stack (.github/workflows/deploy.yml). Deploy this stack
  once by hand; see docs/deployment.md, "Automatic deploys".

Parameters:
  GitHubRepository:
    Type: String
    Default: pratyushkandari@142193293/primex-eventgate@1374248901
    Description: >-
      Repository as GitHub writes it in the OIDC subject, owner@ownerId/name@repoId.
      The IDs tie the role to this repository even if a namesake is created later.
  StackPrefix:
    Type: String
    Default: primex-eventgate-dev
    Description: Name of the application stack; its resources share this prefix
  HttpApiId:
    Type: String
    Default: ux8bwi3i8l
    Description: ID of the stack's API Gateway HTTP API
  SamArtifactsBucket:
    Type: String
    Default: aws-sam-cli-managed-default-samclisourcebucket-p5nx68tux9kv
    Description: Bucket sam deploy uploads packages to (resolve_s3 in samconfig.toml)

Resources:
  # One per account. Lets IAM trust tokens issued to GitHub Actions jobs.
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  # The name deliberately does not start with StackPrefix, so the role cannot
  # change its own permissions through the IAM statements below.
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: primex-eventgate-github-deploy
      Description: Assumed by GitHub Actions on main to sam deploy the EventGate stack
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepository}:ref:refs/heads/main
      Policies:
        - PolicyName: deploy-eventgate-stack
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DeployTheStack
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:ListStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${StackPrefix}/*
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/aws-sam-cli-managed-default/*
              - Sid: UseTheSamTransform
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31
              - Sid: ValidateTemplates
                Effect: Allow
                Action:
                  - cloudformation:ValidateTemplate
                  - cloudformation:GetTemplateSummary
                Resource: "*"
              - Sid: UploadPackages
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${SamArtifactsBucket}
                  - !Sub arn:${AWS::Partition}:s3:::${SamArtifactsBucket}/*
              - Sid: StackFunctions
                Effect: Allow
                Action: lambda:*
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${StackPrefix}-*
              - Sid: StackTables
                Effect: Allow
                Action: dynamodb:*
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${StackPrefix}-*
              - Sid: KeepTheTables
                Effect: Deny
                Action: dynamodb:DeleteTable
                Resource: "*"
              - Sid: StackEventBus
                Effect: Allow
                Action: events:*
                Resource:
                  - !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/${StackPrefix}-*
                  - !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${StackPrefix}-*
              - Sid: StackHttpApi
                Effect: Allow
                Action:
                  - apigateway:GET
                  - apigateway:POST
                  - apigateway:PUT
                  - apigateway:PATCH
                  - apigateway:DELETE
                Resource:
                  - !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis/${HttpApiId}
                  - !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis/${HttpApiId}/*
                  - !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/tags/*
              - Sid: StackFunctionRoles
                Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:UpdateRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:PutRolePolicy
                  - iam:GetRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${StackPrefix}-*
              - Sid: OnlyTheLambdaLoggingPolicy
                Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${StackPrefix}-*
                Condition:
                  ArnEquals:
                    iam:PolicyARN: !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
              - Sid: PassRolesOnlyToLambda
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${StackPrefix}-*
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
      Tags:
        - Key: Project
          Value: EventGate

Outputs:
  DeployRoleArn:
    Description: Set this as the repository variable AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt DeployRole.Arn
